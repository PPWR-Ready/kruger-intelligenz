server {
  listen 80;
  root /usr/share/nginx/html;

  # nginx erbt add_header nicht in Blöcke mit eigenem add_header – daher überall einbinden
  include /etc/nginx/snippets/sicherheit.conf;

  # Service Worker und Startseite nie zwischenspeichern, damit Updates sofort ankommen
  location = /sw.js { include /etc/nginx/snippets/sicherheit.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { include /etc/nginx/snippets/sicherheit.conf; add_header Cache-Control "no-cache"; }

  # Gebaute Dateien haben Hashes im Namen und dürfen lange im Cache bleiben
  location /assets/ { include /etc/nginx/snippets/sicherheit.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Single-Page-App: alle Pfade auf index.html
  location / { try_files $uri $uri/ /index.html; }
}

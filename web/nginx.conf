server {
  listen 80;
  root /usr/share/nginx/html;

  # Komprimieren: v. a. die Haltungserkennung (13 MB WASM → ca. 4 MB)
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml application/manifest+json application/octet-stream;

  # nginx erbt add_header nicht in Blöcke mit eigenem add_header – daher überall einbinden
  include /etc/nginx/snippets/sicherheit.conf;

  # Service Worker und Startseite nie zwischenspeichern, damit Updates sofort ankommen
  location = /sw.js { include /etc/nginx/snippets/sicherheit.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { include /etc/nginx/snippets/sicherheit.conf; add_header Cache-Control "no-cache"; }

  # Gebaute Dateien haben Hashes im Namen und dürfen lange im Cache bleiben
  location /assets/ { include /etc/nginx/snippets/sicherheit.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Haltungserkennung: Pfade sind versioniert (/mediapipe/<version>/, Modell-Datei mit Versionsnummer)
  location /mediapipe/ { include /etc/nginx/snippets/sicherheit.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Web-App-Manifest mit richtigem Typ (sonst application/octet-stream)
  location ~* \.webmanifest$ { include /etc/nginx/snippets/sicherheit.conf; types { } default_type application/manifest+json; add_header Cache-Control "no-cache"; try_files $uri =404; }

  # Single-Page-App: alle Pfade auf index.html
  location / { try_files $uri $uri/ /index.html; }
}
